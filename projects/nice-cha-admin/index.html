<style>
:root{--ink:#302a31;--muted:#706871;--line:#e8dfe8;--bg:#f8f5f8;--card:#fff;--purple:#6f4c7c;--purple2:#8f6d9b;--pink:#c88684;--mint:#69a798;--amber:#b67a2e;--red:#b34853;--green:#3d8269;--shadow:0 12px 35px rgba(61,38,68,.08);--r:16px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px/1.55 Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.prototype{min-height:52px;padding:9px 22px;background:#352d38;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:12px}.prototype a{color:#f6d7e7;font-weight:700;text-decoration:none}.prototype strong{display:block}.prototype span{color:#d9cedb}.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 52px)}aside{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{padding:26px 22px 18px;font-weight:800;font-size:19px;color:var(--purple);letter-spacing:-.03em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}.nav{padding:8px 10px}.nav button{width:100%;border:0;background:transparent;border-radius:10px;text-align:left;padding:11px 12px;color:var(--muted);margin:2px 0}.nav button:hover,.nav button.active{background:#f2ebf3;color:var(--purple);font-weight:700}.sidefoot{margin-top:auto;padding:16px 18px;border-top:1px solid var(--line);font-size:12px}.mode{display:flex;align-items:center;justify-content:space-between;gap:8px}.switch{width:42px;height:24px;border:0;border-radius:20px;background:#d7cbd9;padding:3px}.switch i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--purple)}.switch.on i{transform:translateX(18px)}main{min-width:0}.top{height:70px;background:#ffffffd9;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;position:sticky;top:0;z-index:5}.top h1{font-size:20px;margin:0}.top p{font-size:12px;margin:2px 0 0;color:var(--muted)}.top .actions{margin-left:auto;display:flex;gap:8px}.content{padding:26px;max-width:1450px;margin:auto}.btn{border:1px solid #d4c8d6;background:#fff;color:var(--ink);border-radius:9px;padding:9px 13px;font-weight:700}.btn:hover{border-color:var(--purple);color:var(--purple)}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.15fr .85fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.panel{padding:20px}.kpi{padding:17px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.value{font-size:25px;font-weight:800;letter-spacing:-.04em;margin:7px 0 3px}.sub{font-size:12px;color:var(--muted)}h2{font-size:24px;margin:0 0 4px;letter-spacing:-.03em}h3{font-size:15px;margin:0 0 13px}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.pagehead p{margin:0;color:var(--muted)}.alert{padding:13px 15px;border-radius:11px;background:#fff7e9;border:1px solid #f0d8af;margin:10px 0;font-size:13px}.alert.red{background:#fff0f1;border-color:#edc5c9}.alert.green{background:#eef8f4;border-color:#c7e4d9}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid #d8ced9;background:#fff;border-radius:8px;padding:9px 10px;color:var(--ink)}.field textarea{min-height:76px;resize:vertical}.span2{grid-column:span 2}.span3{grid-column:1/-1}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.toolbar .field{min-width:160px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#f3edf4;color:#675b69;text-align:left;text-transform:uppercase;font-size:10px;letter-spacing:.06em}th,td{padding:10px 11px;border-bottom:1px solid #eee7ee;white-space:nowrap}tbody tr:hover{background:#fbf8fb}.tag{display:inline-block;padding:3px 8px;border-radius:20px;background:#efe8f1;color:var(--purple);font-size:10px;font-weight:800}.tag.green{background:#e8f4ef;color:var(--green)}.tag.amber{background:#fff1dc;color:var(--amber)}.tag.red{background:#fbe7e9;color:var(--red)}.product-row{display:grid;grid-template-columns:1.4fr 80px 120px 110px 100px 38px;gap:8px;align-items:end;padding:11px 0;border-bottom:1px solid var(--line)}.product-row .field{min-width:0}.summary{background:#f4eef5;border-radius:12px;padding:17px;margin-top:15px}.summary p{display:flex;justify-content:space-between;margin:7px 0}.summary p:last-child{font-weight:800;font-size:17px;padding-top:9px;border-top:1px solid #dfd2e1}.account{padding:18px;border-top:4px solid var(--purple2)}.account .value{font-size:20px}.ledger{max-height:260px;overflow:auto}.progress{height:8px;background:#eee7ee;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--mint)}.calc-output{padding:16px;background:#f3edf4;border-radius:12px}.calc-output .value{color:var(--purple)}.scope{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.scope div{border-top:2px solid #d9c9dc;padding:13px}.scope strong{font-size:24px;display:block;color:var(--purple)}.empty{text-align:center;padding:35px;color:var(--muted)}dialog{width:min(760px,calc(100% - 28px));max-height:88vh;border:1px solid var(--line);border-radius:16px;padding:0;box-shadow:0 30px 100px #241a2880}dialog::backdrop{background:#241a2870;backdrop-filter:blur(4px)}.modalhead{padding:17px 20px;background:#f3edf4;display:flex;align-items:center;justify-content:space-between}.modalhead h2{font-size:18px}.modalbody{padding:20px}.close{width:40px;height:40px;border:0;background:transparent;font-size:24px}.toast{position:fixed;right:20px;bottom:20px;z-index:30;padding:12px 16px;background:#352d38;color:#fff;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.error{color:var(--red);font-size:12px;margin-top:8px}.mobilemenu{display:none}.muted{color:var(--muted)}
@media(max-width:1000px){.app{grid-template-columns:76px 1fr}.brand{font-size:0;text-align:center;padding:20px 8px}.brand:before{content:'NC';font-size:18px}.brand small,.nav button span,.sidefoot .mode>span{display:none}.nav button{text-align:center;padding:11px 5px}.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.formgrid{grid-template-columns:repeat(2,1fr)}.span3{grid-column:1/-1}}
@media(max-width:680px){.prototype{align-items:flex-start;flex-direction:column;gap:3px;padding:9px 14px}.app{display:block;min-height:0}.app>aside{position:fixed;bottom:0;left:0;right:0;height:60px;z-index:12;border-right:0;border-top:1px solid var(--line)}.brand,.sidefoot{display:none}.nav{display:flex;overflow:auto;padding:5px}.nav button{min-width:70px;font-size:10px}.main{padding-bottom:62px}.top{height:62px;padding:0 14px}.top .actions .btn:not(.mobilekeep){display:none}.content{padding:16px}.kpis,.three,.scope{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.span2,.span3{grid-column:auto}.product-row{grid-template-columns:1fr 65px 1fr}.product-row>*:nth-child(4),.product-row>*:nth-child(5),.product-row>*:nth-child(6){grid-row:2}.pagehead{align-items:flex-start;flex-direction:column}.value{font-size:21px}}
@media(max-width:430px){.kpis,.three,.scope{grid-template-columns:1fr}.product-row{grid-template-columns:1fr 65px}.product-row>*:not(:first-child):not(:nth-child(2)){grid-column:span 1}}
</style>

<body>
<header class="prototype"><a href="../../">← Back to Portfolio</a><div><strong>Interactive Portfolio Prototype</strong><span>Demonstration data only. This browser version reproduces selected workflows and product decisions from the original desktop application.</span></div></header>
<div class="app"><aside><div class="brand">Nice Cha<small>Retail operations</small></div><nav class="nav" id="nav" aria-label="Demo navigation"></nav><div class="sidefoot"><div class="mode"><span>Owner mode</span><button class="switch on" id="ownerToggle" aria-pressed="true" aria-label="Toggle Owner mode"><i></i></button></div></div></aside><main class="main"><header class="top"><div><h1 id="viewTitle">Dashboard</h1><p>Nice Cha Admin · synthetic workspace</p></div><div class="actions"><button class="btn mobilekeep" id="resetBtn">Reset Demo Data</button></div></header><section class="content" id="content"></section></main></div>
<dialog id="modal"><div class="modalhead"><h2 id="modalTitle">Detail</h2><button class="close" aria-label="Close dialog" id="closeModal">×</button></div><div class="modalbody" id="modalBody"></div></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const today=()=>new Date().toISOString().slice(0,10);
const seed=()=>({
 owner:true,view:'Dashboard',
 products:[{sku:'NC-MT-01',name:'Milk Tea Original',cost:9000,price:18000,active:true},{sku:'NC-BS-02',name:'Brown Sugar Boba',cost:11500,price:23000,active:true},{sku:'NC-MC-03',name:'Matcha Cream',cost:13000,price:26000,active:true},{sku:'NC-LY-04',name:'Lychee Tea',cost:8500,price:19000,active:true}],
 accounts:[{id:'cash',name:'Cash Drawer',balance:2860000,active:true},{id:'bca',name:'BCA Operating',balance:12450000,active:true},{id:'mandiri',name:'Mandiri',balance:7100000,active:true},{id:'market',name:'Marketplace Settlement',balance:3280000,active:true}],
 customers:[{id:'walk',name:'Walk-in Customer'},{id:'c1',name:'Nadia Putri'},{id:'c2',name:'Rafi Pratama'}],
 sales:[{id:'INV-2408',date:today(),customer:'Nadia Putri',cashier:'Alya',method:'Transfer',account:'BCA Operating',paid:30000,total:46000,status:'POSTED',notes:'Balance due Friday',items:[{sku:'NC-BS-02',name:'Brown Sugar Boba',qty:2,original:23000,price:23000,discount:0,cost:11500}]},{id:'INV-2407',date:today(),customer:'Walk-in Customer',cashier:'Alya',method:'Cash',account:'Cash Drawer',paid:57000,total:57000,status:'POSTED',notes:'',items:[{sku:'NC-LY-04',name:'Lychee Tea',qty:3,original:19000,price:19000,discount:0,cost:8500}]}],
 receivables:[{id:'AR-101',party:'Nadia Putri',original:46000,balance:16000,status:'PARTIAL',payments:[{date:today(),account:'BCA Operating',amount:30000,notes:'Initial payment'}]},{id:'AR-102',party:'Rafi Pratama',original:78000,balance:78000,status:'OPEN',payments:[]}],
 payables:[{id:'AP-201',party:'Supplier Demo A',original:1250000,balance:750000,status:'PARTIAL',payments:[{date:today(),account:'BCA Operating',amount:500000,notes:'First installment'}]},{id:'AP-202',party:'Packaging Supplier',original:420000,balance:420000,status:'OPEN',payments:[]}],
 ledger:[{date:today(),account:'Cash Drawer',type:'SALE',amount:57000,note:'INV-2407'},{date:today(),account:'BCA Operating',type:'AR PAYMENT',amount:30000,note:'INV-2408 initial payment'}],
 shift:{opening:250000,expected:842000,counted:776000,explanation:'',status:'OPEN'},
 event:{fee:1800000,transport:450000,staff:600000,other:250000,visitors:900,conversion:18,aov:32000,variable:14500},
 eventActual:{transactions:142,sales:4480000,cost:2180000},nextSale:2409
});
let state=seed();
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VIEWS=['Dashboard','Sales','Transaction History','Finance','Shift Reconciliation','Event & Bazaar','Product Catalog','Demo Information'];
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2500)}
function tag(s){return `<span class="tag ${s==='PAID'||s==='POSTED'||s==='ACTIVE'?'green':s==='PARTIAL'||s==='PENDING'?'amber':s==='VOIDED'?'red':''}">${esc(s)}</span>`}
function field(label,control,cls=''){return `<div class="field ${cls}"><label>${label}</label>${control}</div>`}
function page(title,sub,body,action=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div>${body}`}
function renderNav(){$('#nav').innerHTML=VIEWS.map((v,i)=>`<button class="${state.view===v?'active':''}" onclick="go('${v}')" title="${v}"><span>${i+1}. ${v}</span>${i+1}</button>`).join('')}
function go(v){state.view=v;render()}
function render(){renderNav();$('#viewTitle').textContent=state.view;$('#ownerToggle').classList.toggle('on',state.owner);$('#ownerToggle').setAttribute('aria-pressed',state.owner);$('#content').innerHTML=({Dashboard:dashboard,Sales:salesView,'Transaction History':historyView,Finance:financeView,'Shift Reconciliation':shiftView,'Event & Bazaar':eventView,'Product Catalog':catalogView,'Demo Information':infoView}[state.view]||dashboard)();bind()}
function dashboard(){const revenue=state.sales.filter(s=>s.status==='POSTED'&&s.date===today()).reduce((a,s)=>a+s.total,0),openAR=state.receivables.reduce((a,x)=>a+x.balance,0),openAP=state.payables.reduce((a,x)=>a+x.balance,0),cash=state.accounts.reduce((a,x)=>a+x.balance,0),diff=state.shift.counted-state.shift.expected;return page('Daily control','Exceptions first, totals second.',`<div class="grid kpis"><div class="card kpi"><div class="eyebrow">Today’s sales</div><div class="value">${rp(revenue)}</div><div class="sub">${state.sales.filter(x=>x.date===today()).length} posted / retained records</div></div><div class="card kpi"><div class="eyebrow">Cash / bank position</div><div class="value">${rp(cash)}</div><div class="sub">Across ${state.accounts.length} active accounts</div></div><div class="card kpi"><div class="eyebrow">Open receivables</div><div class="value">${rp(openAR)}</div><div class="sub">${state.receivables.filter(x=>x.status!=='PAID').length} balances</div></div><div class="card kpi"><div class="eyebrow">Open payables</div><div class="value">${rp(openAP)}</div><div class="sub">${state.payables.filter(x=>x.status!=='PAID').length} supplier balances</div></div></div><div class="grid two" style="margin-top:16px"><div class="card panel"><h3>Requires attention</h3><div class="alert">Nadia Putri receivable is partially paid · ${rp(16000)} outstanding.</div><div class="alert">Supplier Demo A balance due · ${rp(750000)} outstanding.</div><div class="alert red">Cashier shift is open · current difference ${rp(diff)}.</div></div><div class="card panel"><h3>Event / Bazaar snapshot</h3>${eventSummary()}<button class="btn small" onclick="go('Event & Bazaar')">Review assumptions</button></div></div>`)}
function blankLine(i=Date.now()){const opts=state.products.filter(p=>p.active).map(p=>`<option value="${p.sku}">${p.name} · ${rp(p.price)}</option>`).join('');return `<div class="product-row" data-line="${i}">${field('Product',`<select class="prod"><option value="">Select product</option>${opts}</select>`)}${field('Qty','<input class="qty" type="number" min="1" step="1" value="1">')}${field('Unit price','<input class="price" type="number" min="0" value="0">')}${field('Discount','<input class="discount" type="number" min="0" value="0">')}${field('Pricing','<select class="pricing"><option>CATALOG</option><option>FREETYPE</option></select>')}<button class="btn small danger remove" aria-label="Remove item">×</button></div>`}
function salesView(){return page('Post a sale','Catalog pricing, explicit exceptions, payment destination, and credit.',`<div class="card panel"><div id="saleLines">${blankLine(1)}${blankLine(2)}</div><button class="btn small" id="addLine">+ Add product</button><div class="formgrid" style="margin-top:16px">${field('Customer',`<select id="customer">${state.customers.map(x=>`<option>${x.name}</option>`).join('')}</select>`)}${field('Payment method','<select id="paymentMethod"><option>Cash</option><option>Transfer</option><option>Marketplace</option><option>Credit</option></select>')}${field('Destination account',`<select id="saleAccount">${state.accounts.filter(x=>x.active).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select>`)}${field('Amount paid','<input id="paid" type="number" min="0" value="0">')}${field('Notes','<textarea id="saleNotes" placeholder="Operational note"></textarea>','span2')}</div><div class="summary" id="saleSummary"><p><span>Total</span><span>${rp(0)}</span></p><p><span>Paid</span><span>${rp(0)}</span></p><p><span>Outstanding</span><span>${rp(0)}</span></p></div><div id="saleError" class="error"></div><button class="btn primary" id="postSale">Post transaction</button></div>`)}
function historyView(){const rows=state.sales.map(s=>`<tr><td>${s.date}</td><td><button class="btn small" onclick="saleDetail('${s.id}')">${s.id}</button></td><td>${esc(s.customer)}</td><td>${s.items.map(i=>esc(i.sku)).join(', ')}</td><td>${rp(s.total)}</td><td>${rp(Math.max(0,s.total-s.paid))}</td><td>${tag(s.status)}</td></tr>`).join('');return page('Transaction history','Searchable operational trace with corrections preserved.',`<div class="toolbar">${field('Date','<input id="histDate" type="date">')}${field('Search','<input id="histSearch" placeholder="Invoice, customer, SKU, product">')}${field('Rows','<select id="rowCount"><option>25</option><option>50</option></select>')}</div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Transaction</th><th>Customer</th><th>SKU</th><th>Total</th><th>Outstanding</th><th>Status</th></tr></thead><tbody id="historyRows">${rows}</tbody></table></div><p class="sub">Page 1 · ${state.sales.length} synthetic records</p>`)}
function financeView(){return page('Finance','Money movement identifies where funds moved and why.',`<div class="grid kpis">${state.accounts.map(a=>`<div class="card account"><div class="eyebrow">${a.active?'Active account':'Inactive'}</div><h3>${a.name}</h3><div class="value">${rp(a.balance)}</div></div>`).join('')}</div><div class="grid two" style="margin-top:16px"><div class="card panel"><h3>Internal transfer</h3><div class="formgrid">${field('From account',`<select id="fromAccount">${accountOptions()}</select>`)}${field('To account',`<select id="toAccount">${accountOptions()}</select>`)}${field('Amount','<input id="transferAmount" type="number" min="1" value="250000">')}${field('Admin fee','<input id="transferFee" type="number" min="0" value="2500">')}${field('Notes','<input id="transferNotes" value="Cash deposit">','span2')}</div><div id="transferError" class="error"></div><button class="btn primary" id="doTransfer">Post transfer</button><p class="sub">Principal moves between accounts. Only the administration fee becomes an expense.</p></div><div class="card panel ledger"><h3>Recent account ledger</h3>${state.ledger.map(x=>`<p><b>${esc(x.type)}</b> · ${esc(x.account)}<br><span class="${x.amount<0?'error':'muted'}">${x.amount<0?'−':'+'}${rp(Math.abs(x.amount))} · ${esc(x.note)}</span></p>`).join('')}</div></div><div class="grid two" style="margin-top:16px"><div class="card panel"><h3>Receivables</h3>${balances('AR',state.receivables)}</div><div class="card panel"><h3>Payables</h3>${balances('AP',state.payables)}</div></div>`)}
function balances(type,list){return list.map(x=>`<div class="alert"><b>${x.id} · ${esc(x.party)}</b> ${tag(x.status)}<br>${rp(x.balance)} of ${rp(x.original)} outstanding<br><button class="btn small" onclick="paymentModal('${type}','${x.id}')" ${x.status==='PAID'?'disabled':''}>Record staged payment</button></div>`).join('')}
function shiftView(){const s=state.shift,d=s.counted-s.expected;return page('Shift reconciliation','Keep expected and physical cash differences visible.',`<div class="grid two"><div class="card panel"><div class="formgrid">${field('Opening cash',`<input value="${s.opening}" disabled>`)}${field('Expected cash',`<input id="expectedCash" type="number" value="${s.expected}">`)}${field('Counted cash',`<input id="countedCash" type="number" value="${s.counted}">`)}${field('Explanation',`<textarea id="shiftExplanation">${esc(s.explanation)}</textarea>`,'span3')}</div><div id="shiftError" class="error"></div><button class="btn primary" id="closeShift">Reconcile shift</button></div><div class="card panel"><div class="eyebrow">Current difference</div><div class="value" id="shiftDifference">${rp(d)}</div><p>Differences above Rp50.000 remain pending for review.</p><p id="shiftStatus">${tag(s.status)}</p></div></div>`)}
function eventCalc(){const e=state.event,fixed=e.fee+e.transport+e.staff+e.other,tx=Math.round(e.visitors*e.conversion/100),sales=tx*e.aov,contribution=e.aov-e.variable,beSales=contribution>0?fixed/(contribution/e.aov):Infinity,beTx=contribution>0?Math.ceil(fixed/contribution):Infinity,profit=sales-tx*e.variable-fixed,roi=fixed?profit/fixed*100:0,safety=sales?((sales-beSales)/sales*100):0,rec=profit>fixed*.2?'GO':profit>=0?'CAUTION':'NOT ATTRACTIVE';return{fixed,tx,sales,beSales,beTx,profit,roi,safety,rec}}
function eventSummary(){const c=eventCalc();return `<div class="eyebrow">Recommendation</div><div class="value">${c.rec}</div><p>Projected ${c.tx} transactions · ${rp(c.sales)} sales</p><p class="sub">Decision support based on assumptions, not a financial guarantee.</p>`}
function eventView(){const e=state.event,c=eventCalc();return page('Event & Bazaar','Turn an event decision into explicit assumptions and thresholds.',`<div class="grid two"><div class="card panel"><div class="formgrid">${[['Event fee','fee'],['Transport cost','transport'],['Staff cost','staff'],['Other fixed costs','other'],['Expected visitors','visitors'],['Conversion rate (%)','conversion'],['Average order value','aov'],['Variable cost / order','variable']].map(([l,k])=>field(l,`<input class="eventInput" data-key="${k}" type="number" min="0" value="${e[k]}">`)).join('')}</div></div><div class="card panel calc-output" id="eventResults">${eventResults(c)}</div></div><div class="card panel" style="margin-top:16px"><h3>Actual vs forecast · synthetic example</h3><div class="grid three"><div><div class="eyebrow">Actual transactions</div><div class="value">${state.eventActual.transactions}</div></div><div><div class="eyebrow">Actual sales</div><div class="value">${rp(state.eventActual.sales)}</div></div><div><div class="eyebrow">Actual direct cost</div><div class="value">${rp(state.eventActual.cost)}</div></div></div></div>`)}
function eventResults(c){return `<div class="eyebrow">Recommendation</div><div class="value">${c.rec}</div><p>Expected transactions <b>${c.tx}</b></p><p>Projected sales <b>${rp(c.sales)}</b></p><p>Break-even sales <b>${isFinite(c.beSales)?rp(c.beSales):'Unavailable'}</b></p><p>Break-even transactions <b>${isFinite(c.beTx)?c.beTx:'Unavailable'}</b></p><p>Projected profit <b>${rp(c.profit)}</b></p><p>ROI <b>${c.roi.toFixed(1)}%</b></p><p>Safety margin <b>${c.safety.toFixed(1)}%</b></p><p class="sub">This is decision support based on assumptions, not a financial guarantee.</p>`}
function catalogView(){return page('Product catalog','A simple pricing source for the sales workflow—not a full WMS.',`<div class="tablewrap"><table><thead><tr><th>SKU</th><th>Product</th><th>Cost</th><th>Retail price</th><th>Status</th><th></th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${p.sku}</td><td>${esc(p.name)}</td><td>${rp(p.cost)}</td><td>${rp(p.price)}</td><td>${tag(p.active?'ACTIVE':'INACTIVE')}</td><td><button class="btn small" onclick="editProduct('${p.sku}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`)}
function infoView(){return page('Demo information','What this browser prototype represents.',`<div class="grid two"><div class="card panel"><h3>Original Nice Cha Admin</h3><p>Electron + SQLite desktop application for transaction-oriented store operations.</p><p>Implemented workflows include sales, accounts, financial exceptions, reconciliation, owner controls, and reporting. No production adoption or business ROI is claimed here.</p></div><div class="card panel"><h3>Browser portfolio version</h3><p>Self-contained HTML with synthetic browser state and selected working flows. It has no production database, cloud deployment, or complete purchasing / inventory workflow.</p></div></div><div class="card panel" style="margin-top:16px"><h3>Original implementation scope</h3><div class="scope"><div><strong>7</strong>database migrations</div><div><strong>28</strong>database tables</div><div><strong>3</strong>operational positions</div><div><strong>5</strong>permission-controlled modules</div><div><strong>25</strong>automated tests</div><div><strong>12</strong>test files</div></div><p class="sub">These describe the original implementation, not business-performance KPIs or the structure of this browser file.</p></div>`)}
function accountOptions(){return state.accounts.filter(x=>x.active).map(x=>`<option value="${x.id}">${x.name} · ${rp(x.balance)}</option>`).join('')}
function saleTotal(){return [...document.querySelectorAll('.product-row')].reduce((sum,row)=>{const q=+row.querySelector('.qty').value||0,p=+row.querySelector('.price').value||0,d=+row.querySelector('.discount').value||0;return sum+q*Math.max(0,p-d)},0)}
function updateSaleSummary(){const total=saleTotal(),paid=+$ ('#paid')?.value||0;const box=$('#saleSummary');if(box)box.innerHTML=`<p><span>Total</span><span>${rp(total)}</span></p><p><span>Paid</span><span>${rp(paid)}</span></p><p><span>Outstanding</span><span>${rp(Math.max(0,total-paid))}</span></p>`}
function bind(){if(state.view==='Sales'){const lines=$('#saleLines');lines.addEventListener('change',e=>{const row=e.target.closest('.product-row');if(e.target.classList.contains('prod')){const p=state.products.find(x=>x.sku===e.target.value);row.querySelector('.price').value=p?.price||0}updateSaleSummary()});lines.addEventListener('input',updateSaleSummary);lines.addEventListener('click',e=>{if(e.target.classList.contains('remove')){e.target.closest('.product-row').remove();updateSaleSummary()}});$('#addLine').onclick=()=>lines.insertAdjacentHTML('beforeend',blankLine());$('#paid').oninput=updateSaleSummary;$('#postSale').onclick=postSale}
if(state.view==='Transaction History'){const filter=()=>{const q=$('#histSearch').value.toLowerCase(),d=$('#histDate').value;document.querySelectorAll('#historyRows tr').forEach((tr,i)=>{const s=state.sales[i];tr.hidden=!!((d&&s.date!==d)||(q&&!JSON.stringify(s).toLowerCase().includes(q)))})};$('#histSearch').oninput=filter;$('#histDate').onchange=filter}
if(state.view==='Finance')$('#doTransfer').onclick=transfer;
if(state.view==='Shift Reconciliation'){const update=()=>$('#shiftDifference').textContent=rp((+$('#countedCash').value||0)-(+$('#expectedCash').value||0));$('#countedCash').oninput=update;$('#expectedCash').oninput=update;$('#closeShift').onclick=reconcile}
if(state.view==='Event & Bazaar')document.querySelectorAll('.eventInput').forEach(el=>el.oninput=()=>{state.event[el.dataset.key]=+el.value||0;$('#eventResults').innerHTML=eventResults(eventCalc())})}
function postSale(){const error=$('#saleError'),rows=[...document.querySelectorAll('.product-row')],items=[];for(const row of rows){const sku=row.querySelector('.prod').value;if(!sku)continue;const product=state.products.find(x=>x.sku===sku),qty=+row.querySelector('.qty').value,price=+row.querySelector('.price').value,discount=+row.querySelector('.discount').value,mode=row.querySelector('.pricing').value;if(!Number.isInteger(qty)||qty<1)return error.textContent='Quantity must be a positive whole number.';if(price<0||discount<0||discount>price)return error.textContent='Use valid Rupiah amounts; discount cannot exceed unit price.';if(price!==product.price&&mode!=='FREETYPE')return error.textContent='Changed unit price requires FREETYPE pricing mode.';items.push({sku,name:product.name,qty,original:product.price,price,discount,cost:product.cost})}if(!items.length)return error.textContent='Select at least one product.';const total=items.reduce((a,i)=>a+i.qty*(i.price-i.discount),0),paid=+$('#paid').value||0,method=$('#paymentMethod').value,customer=$('#customer').value,account=state.accounts.find(a=>a.id===$('#saleAccount').value);if(paid<0||paid>total)return error.textContent='Paid amount must be between zero and the sale total.';if((method==='Credit'||paid<total)&&customer==='Walk-in Customer')return error.textContent='Credit or partial payment requires a named customer.';if(!account?.active)return error.textContent='Payment destination account must be active.';const id='INV-'+state.nextSale++,sale={id,date:today(),customer,cashier:'Demo Cashier',method,account:account.name,paid,total,status:'POSTED',notes:$('#saleNotes').value,items};state.sales.unshift(sale);account.balance+=paid;if(paid)state.ledger.unshift({date:today(),account:account.name,type:'SALE RECEIPT',amount:paid,note:id});if(paid<total)state.receivables.unshift({id:'AR-'+id.slice(4),party:customer,original:total,balance:total-paid,status:paid?'PARTIAL':'OPEN',payments:paid?[{date:today(),account:account.name,amount:paid,notes:'Initial sale payment'}]:[]});toast(`${id} posted; dashboard and financial state updated.`);go('Transaction History')}
function transfer(){const err=$('#transferError'),from=state.accounts.find(a=>a.id===$('#fromAccount').value),to=state.accounts.find(a=>a.id===$('#toAccount').value),amount=+$('#transferAmount').value,fee=+$('#transferFee').value||0;if(from===to)return err.textContent='Source and destination must be different.';if(amount<=0||fee<0)return err.textContent='Enter valid positive transfer values.';if(from.balance<amount+fee)return err.textContent='Source account has insufficient balance.';from.balance-=amount+fee;to.balance+=amount;const note=$('#transferNotes').value||'Internal transfer';state.ledger.unshift({date:today(),account:from.name,type:'TRANSFER OUT',amount:-amount,note},{date:today(),account:to.name,type:'TRANSFER IN',amount,note});if(fee)state.ledger.unshift({date:today(),account:from.name,type:'ADMIN FEE / EXPENSE',amount:-fee,note});toast(`Transferred ${rp(amount)}; only ${rp(fee)} recorded as expense.`);render()}
function reconcile(){const expected=+$('#expectedCash').value||0,counted=+$('#countedCash').value||0,diff=counted-expected,explanation=$('#shiftExplanation').value.trim();if(diff&& !explanation)return $('#shiftError').textContent='Explain any non-zero discrepancy before reconciliation.';state.shift={...state.shift,expected,counted,explanation,status:Math.abs(diff)>50000?'PENDING':'CLOSED'};toast(state.shift.status==='PENDING'?'Difference retained for Owner review.':'Shift reconciled.');render()}
function saleDetail(id){const s=state.sales.find(x=>x.id===id);modal(`Transaction ${s.id}`,`<p>${tag(s.status)} · ${s.date} · ${esc(s.cashier)}</p><div class="tablewrap"><table><thead><tr><th>Item</th><th>Qty</th><th>Original</th><th>Final</th><th>Discount</th><th>Stored cost</th></tr></thead><tbody>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${rp(i.original)}</td><td>${rp(i.price)}</td><td>${rp(i.discount)}</td><td>${rp(i.cost)}</td></tr>`).join('')}</tbody></table></div><p>Payment: <b>${esc(s.method)}</b> → ${esc(s.account)}<br>Paid ${rp(s.paid)} · Outstanding ${rp(Math.max(0,s.total-s.paid))}<br>Notes: ${esc(s.notes||'—')}</p>${state.owner&&s.status==='POSTED'?`<div class="toolbar"><button class="btn" onclick="editSale('${s.id}')">EDIT</button><button class="btn danger" onclick="voidSaleForm('${s.id}')">VOID</button></div>`:'<p class="sub">Owner mode is required for correction actions.</p>'}`)}
function editSale(id){const s=state.sales.find(x=>x.id===id);modal(`Correct ${id}`,`<p>Correction preserves history: previous impact → reversal → corrected impact.</p>${field('Corrected total',`<input id="correctedTotal" type="number" value="${s.total}">`)}${field('Reason','<input id="correctionReason" placeholder="Required reason">')}<div id="modalError" class="error"></div><button class="btn primary" onclick="applyCorrection('${id}')">Apply correction</button>`)}
function applyCorrection(id){const s=state.sales.find(x=>x.id===id),next=+$('#correctedTotal').value,reason=$('#correctionReason').value.trim();if(!reason||next<=0)return $('#modalError').textContent='Enter a valid total and correction reason.';if(s.total-s.paid>0&&s.paid>=s.total)return $('#modalError').textContent='Paid receivable state blocks this correction.';s.audit={previousTotal:s.total,reason,correctedAt:new Date().toISOString()};s.total=next;$('#modal').close();toast('Previous impact reversed; corrected impact posted with audit snapshot.');render()}
function voidSaleForm(id){modal(`Void ${id}`,`${field('Reason','<textarea id="voidReason" placeholder="Required reason"></textarea>')}<div id="modalError" class="error"></div><button class="btn danger" onclick="applyVoid('${id}')">Preserve and void transaction</button>`)}
function applyVoid(id){const s=state.sales.find(x=>x.id===id),reason=$('#voidReason').value.trim();if(!reason)return $('#modalError').textContent='A void reason is required.';const account=state.accounts.find(a=>a.name===s.account);if(account)account.balance-=s.paid;s.status='VOIDED';s.voidReason=reason;s.audit={previousTotal:s.total,reason,voidedAt:new Date().toISOString()};state.ledger.unshift({date:today(),account:s.account,type:'VOID REVERSAL',amount:-s.paid,note:id});$('#modal').close();toast('Transaction retained as VOIDED and financial effect reversed.');render()}
function paymentModal(type,id){const list=type==='AR'?state.receivables:state.payables,x=list.find(y=>y.id===id);modal(`Pay ${id}`,`<p>${esc(x.party)} · ${rp(x.balance)} outstanding</p>${field('Account',`<select id="payAccount">${accountOptions()}</select>`)}${field('Amount',`<input id="payAmount" type="number" value="${x.balance}">`)}${field('Notes','<input id="payNotes" value="Staged payment">')}<div id="modalError" class="error"></div><button class="btn primary" onclick="applyPayment('${type}','${id}')">Record payment</button><h3 style="margin-top:18px">Payment history</h3>${x.payments.length?x.payments.map(p=>`<p>${p.date} · ${p.account} · ${rp(p.amount)} · ${esc(p.notes)}</p>`).join(''):'<p class="muted">No payments recorded.</p>'}`)}
function applyPayment(type,id){const list=type==='AR'?state.receivables:state.payables,x=list.find(y=>y.id===id),amount=+$('#payAmount').value,account=state.accounts.find(a=>a.id===$('#payAccount').value);if(amount<=0||amount>x.balance)return $('#modalError').textContent='Payment must be positive and cannot exceed the outstanding balance.';if(type==='AP'&&account.balance<amount)return $('#modalError').textContent='Selected account has insufficient balance.';x.balance-=amount;x.status=x.balance===0?'PAID':'PARTIAL';x.payments.push({date:today(),account:account.name,amount,notes:$('#payNotes').value});account.balance+=type==='AR'?amount:-amount;state.ledger.unshift({date:today(),account:account.name,type:type+' PAYMENT',amount:type==='AR'?amount:-amount,note:id});$('#modal').close();toast(type==='AR'?'Old balance collected without creating new revenue.':'Supplier balance reduced.');render()}
function editProduct(sku){const p=state.products.find(x=>x.sku===sku);modal(`Edit ${sku}`,`${field('Product name',`<input id="editName" value="${esc(p.name)}">`)}${field('Cost',`<input id="editCost" type="number" value="${p.cost}">`)}${field('Retail price',`<input id="editPrice" type="number" value="${p.price}">`)}${field('Status',`<select id="editActive"><option value="true" ${p.active?'selected':''}>ACTIVE</option><option value="false" ${!p.active?'selected':''}>INACTIVE</option></select>`)}<div id="modalError" class="error"></div><button class="btn primary" onclick="saveProduct('${sku}')">Save demo change</button>`)}
function saveProduct(sku){const p=state.products.find(x=>x.sku===sku),cost=+$('#editCost').value,price=+$('#editPrice').value;if(cost<0||price<=0)return $('#modalError').textContent='Enter valid cost and retail price.';p.name=$('#editName').value.trim()||p.name;p.cost=cost;p.price=price;p.active=$('#editActive').value==='true';$('#modal').close();toast('Catalog updated in browser state.');render()}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').showModal()}
$('#closeModal').onclick=()=>$('#modal').close();$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').close()};$('#ownerToggle').onclick=()=>{state.owner=!state.owner;toast(state.owner?'Owner controls enabled.':'Owner controls hidden.');render()};$('#resetBtn').onclick=()=>{modal('Reset demo data',`<p>Restore the default synthetic dataset and discard browser-session changes?</p><button class="btn danger" id="confirmReset">Reset Demo Data</button>`);$('#confirmReset').onclick=()=>{state=seed();$('#modal').close();toast('Synthetic demo data restored.');render()}};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').close()});render();
</script>
</body>
</html>
